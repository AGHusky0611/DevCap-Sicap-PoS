<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICAP Aloha</title>
    <link rel="icon" type="image/png" href="res/SICAP.png">
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="res/SICAP.png" alt="SicapLogo" style="max-width: 100%; max-height: 100%;">
        </div>
        <h1>SICAP Aloha</h1>
        <a href="admin.html" class="admin-link">Manage Products</a>
        <label class="theme-switch" for="theme-toggle-checkbox" aria-label="Toggle theme">
            <input type="checkbox" id="theme-toggle-checkbox">
            <span class="slider"></span>
        </label>
        <button class="cart-button" id="open-cart-btn" aria-label="Open cart">
            Cart <span class="cart-count" id="cart-count">0</span>
        </button>
    </header>

    <main id="product-list">
        <!-- Products will be loaded here dynamically from Firestore -->
    </main>

    <aside class="cart-panel" id="cart-panel" aria-hidden="true">
        <div class="cart-header">
            <div>Your Cart</div>
            <button id="close-cart-btn" class="close-cart-btn" aria-label="Close cart">&times;</button>
        </div>
        <div class="cart-body" id="cart-body">
            <div class="cart-empty" id="cart-empty">Your cart is empty.</div>
        </div>

        <!-- Add this section for Officer Name -->
        <div class="cart-officer">
            <label for="officer-name" class="officer-label">Officer Name</label>
            <input id="officer-name" class="officer-input" type="text" placeholder="Enter your name" required>
            <div id="officer-error" class="field-error" aria-hidden="true">Please enter officer name.</div>
        </div>
        
        <div class="cart-footer">
            <div class="cart-total-row">
                <div>Total:</div>
                <div id="cart-total">₱0.00</div>
            </div>
            <button class="checkout-btn" id="checkout-btn">Checkout</button>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Load script.js as a module -->
    <script type="module" src="public/js/script.js"></script>
</body>
</html>

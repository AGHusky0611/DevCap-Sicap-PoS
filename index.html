<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICAP Aloha</title>
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="res/SICAP.png" alt="SicapLogo" style="max-width: 100%; max-height: 100%;">
        </div>
        <h1>SICAP Aloha</h1>
        <button class="cart-button" id="open-cart-btn" aria-label="Open cart">
            Cart <span class="cart-count" id="cart-count">0</span>
        </button>
    </header>

    <main>
        <!-- Product Items -->
        <div class="product-row">
            <div class="product-image-placeholder"><img src="res/CC.jpg" alt="Chocolate Cookie"></div>
            <div class="product-name">Chocolate Cookie</div>
            <div class="product-details">
                <div class="product-price">₱20.00</div>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <div class="product-row">
            <div class="product-image-placeholder"><img src="res/Velvet.png" alt="Red Velvet Cookie"></div>
            <div class="product-name">Red Velvet Cookie</div>
            <div class="product-details">
                <div class="product-price">₱20.00</div>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <div class="product-row">
            <div class="product-image-placeholder"><img src="res/matcha.jpg" alt="Matcha Cookie"></div>
            <div class="product-name">Matcha Cookie</div>
            <div class="product-details">
                <div class="product-price">₱20.00</div>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <div class="product-row">
            <div class="product-image-placeholder"><img src="res/oatmeal.jpg" alt="Oats Cookie"></div>
            <div class="product-name">Oats Cookie</div>
            <div class="product-details">
                <div class="product-price">₱20.00</div>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <div class="product-row">
            <div class="product-image-placeholder"><img src="res/FruitCups.jpg" alt="Fruit Cups"></div>
            <div class="product-name">Fruit Cups</div>
            <div class="product-details">
                <div class="product-price">₱50.00</div>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <div class="product-row">
            <div class="product-image-placeholder">Image</div>
            <div class="product-name">Juice</div>
            <div class="product-details">
                <div class="product-price">₱20.00</div>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
    </main>

    <aside class="cart-panel" id="cart-panel" aria-hidden="true">
        <div class="cart-header">
            <div>Your Cart</div>
            <button id="close-cart-btn" class="close-cart-btn" aria-label="Close cart">&times;</button>
        </div>
        <div class="cart-body" id="cart-body">
            <div class="cart-empty" id="cart-empty">Your cart is empty.</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <div>Total:</div>
                <div id="cart-total">₱0.00</div>
            </div>
            <button class="checkout-btn" id="checkout-btn">Checkout</button>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- Use the "compat" libraries to match your script.js -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>

    <script src="public/js/script.js"></script>
</body>
</html>

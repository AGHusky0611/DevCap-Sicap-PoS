<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products</title>
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="res/SICAP.png" alt="SicapLogo" style="max-width: 100%; max-height: 100%;">
        </div>
        <h1>Product Management</h1>
        <a href="index.html" class="admin-link">Back to POS</a>
        <label class="theme-switch" for="theme-toggle-checkbox" aria-label="Toggle theme">
            <input type="checkbox" id="theme-toggle-checkbox">
            <span class="slider"></span>
        </label>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <h2>Add New Product</h2>
            <form id="add-product-form">
                <input type="text" id="product-name-input" placeholder="Product Name" required>
                <input type="number" id="product-price-input" placeholder="Price" step="any" required>
                <input type="text" id="product-image-input" placeholder="Image Path (e.g., res/new.jpg)" required>
                <button type="submit">Save Product</button>
            </form>
        </div>

        <div class="admin-card">
            <h2>Current Products</h2>
            <div id="admin-product-list">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <script type="module" src="public/js/admin.js"></script>
</body>
</html>

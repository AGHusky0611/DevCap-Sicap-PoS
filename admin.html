<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Products</title>
    <link rel="icon" type="image/png" href="res/SICAP.png">
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-link">
            <div class="logo">
                <img src="res/SICAP.png" alt="SicapLogo" style="max-width: 100%; max-height: 100%;">
            </div>
            <h1>Product Management</h1>
        </a>
        <a href="index.html" class="admin-link">Back to POS</a>
        <label class="theme-switch" for="theme-toggle-checkbox" aria-label="Toggle theme">
            <input type="checkbox" id="theme-toggle-checkbox">
            <span class="slider"></span>
        </label>
    </header>

    <div class="admin-container">
        <div class="admin-card">
            <h2>Add New Product</h2>
            <form id="add-product-form">
                <input type="text" id="product-name-input" placeholder="Product Name" required>
                <input type="number" id="product-price-input" placeholder="Price" step="0.01" required>
                <input type="text" id="product-image-input" placeholder="Image Path (e.g., res/image.png)" required>
                <button type="submit">Add Product</button>
            </form>
        </div>

        <div class="admin-card">
            <h2>Database Management</h2>
            <button id="download-db-btn" class="download-btn">Download Products as CSV</button>
            <button id="download-sales-btn" class="download-btn sales">Download Sales Report</button>
        </div>

        <div class="admin-card">
            <h2>Current Products</h2>
            <div id="admin-product-list">
                <!-- Products will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Edit Product Modal -->
    <div id="edit-modal-overlay" class="modal-overlay">
        <div id="edit-modal" class="modal">
            <h2>Edit Product</h2>
            <form id="edit-product-form">
                <input type="hidden" id="edit-product-id">
                <label for="edit-product-name">Product Name</label>
                <input type="text" id="edit-product-name" required>
                
                <label for="edit-product-price">Price</label>
                <input type="number" id="edit-product-price" step="0.01" required>
                
                <label for="edit-product-image">Image Path</label>
                <input type="text" id="edit-product-image" required>
                
                <div class="modal-actions">
                    <button type="submit" class="save-btn">Save Changes</button>
                    <button type="button" id="cancel-edit-btn" class="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="public/js/admin.js"></script>
</body>
</html>
